<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GMI Billboard - Media Advertising Outdoor Jabodetabek</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--bg2:#f3f7fb;--fg:#0b1220;--mute:#556071;--accd:#1479b0;--acc:#27aae1;--acc2:#ed2024;--line:rgba(11,18,32,.11);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--fg);font-family:Sora,system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.dsp{font-family:'Space Grotesk',Impact,sans-serif;letter-spacing:-.02em}
.ph{width:1em;height:1em;vertical-align:-.125em;flex:none}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:16px clamp(16px,4vw,48px);backdrop-filter:blur(14px);background:linear-gradient(#ffffffee,#ffffff00)}
.logo{font:900 20px 'Space Grotesk',sans-serif;display:flex;gap:10px;align-items:center}.lg{height:34px;width:auto;display:block;background:#fff;padding:4px 10px;border-radius:10px}
nav ul{display:flex;gap:26px;list-style:none;font-weight:600;font-size:14px;color:var(--mute)}nav ul a:hover{color:var(--fg)}
.btn{display:inline-flex;gap:10px;align-items:center;padding:14px 22px;border-radius:999px;font-weight:800;font-size:14px;background:var(--acc);color:#000;transition:.3s;position:relative;overflow:hidden;border:0;cursor:pointer}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 40px -8px var(--acc)}.btn.g{background:transparent;color:var(--fg);border:1px solid var(--line)}
#hero{position:relative;height:100vh;min-height:640px;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.hc{position:absolute;right:clamp(16px,4vw,48px);bottom:clamp(90px,14vh,150px);max-width:min(620px,46vw);z-index:2;pointer-events:none}
.hc>*{pointer-events:auto}
#hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(transparent,var(--bg));z-index:1;pointer-events:none}
.tag{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accd);margin-bottom:18px}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--acc2);animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #ff3d2e00;opacity:.4}0%{box-shadow:0 0 0 0 #ff3d2e99}}
h1{font-size:clamp(34px,6vw,76px);line-height:1;font-weight:900}
h1 span{background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 5s linear infinite}
@keyframes gs{to{background-position:200%}}
.hc p{margin:20px 0 28px;color:#3b4558;max-width:480px;line-height:1.6}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.hud{position:absolute;left:clamp(16px,4vw,48px);bottom:clamp(40px,6vh,70px);z-index:2;text-align:left}
.hud small{display:block;color:var(--mute);font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.hud h3{font-size:clamp(18px,2.4vw,30px);min-height:1.3em}
.hud .row{display:flex;gap:10px;justify-content:flex-start;margin-top:14px;align-items:center}
.hud button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#ffffffcc;color:var(--fg);font-size:20px;cursor:pointer;transition:.25s;backdrop-filter:blur(8px)}.hud button:hover{background:var(--acc);color:#000}
.hud .n{font:700 14px 'Space Grotesk';color:var(--mute);min-width:64px}
.scroll{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:2;color:var(--mute);font-size:22px;animation:bn 1.8s infinite}
@keyframes bn{50%{transform:translate(-50%,8px)}}
.mq{border-block:1px solid var(--line);background:var(--bg2);overflow:hidden;padding:20px 0}
.mt{display:flex;gap:48px;width:max-content;animation:mq 40s linear infinite}.mq:hover .mt{animation-play-state:paused}
.mt span{font:700 18px 'Space Grotesk';color:var(--mute);display:flex;gap:14px;align-items:center;white-space:nowrap}.mt .ph{color:var(--acc)}
@keyframes mq{to{transform:translateX(-50%)}}
section.s{padding:clamp(70px,10vw,140px) clamp(16px,4vw,48px);max-width:1280px;margin:auto}
.eyebrow{color:var(--accd);font-weight:800;letter-spacing:.16em;font-size:12px;text-transform:uppercase;margin-bottom:14px}
h2{font-size:clamp(28px,4.4vw,56px);line-height:1.05;font-weight:900;max-width:820px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:48px}
.stats div{background:var(--bg);padding:32px}.stats b{font:900 clamp(36px,5vw,60px) 'Space Grotesk';display:block;color:var(--accd)}.stats span{color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:48px}
.card{position:relative;padding:28px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,var(--bg2),var(--bg));overflow:hidden;transition:.4s;transform-style:preserve-3d}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),#27aae130,transparent 60%);opacity:0;transition:.4s}.card:hover::before{opacity:1}
.card:hover{border-color:#27aae166;transform:translateY(-6px)}
.card .ph{font-size:30px;color:var(--acc);margin-bottom:22px}.card h3{font-size:18px;margin-bottom:10px}.card p{color:var(--mute);font-size:14px;line-height:1.6}
.card .go{position:absolute;top:24px;right:24px;font-size:20px;color:var(--mute);transition:.3s}.card:hover .go{color:var(--acc);transform:translate(4px,-4px)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:48px}
.wall button{all:unset;cursor:pointer;position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2/1;border:1px solid var(--line);transition:.4s}
.wall img{width:100%;height:100%;object-fit:cover;display:block;transition:.6s}.wall button:hover img{transform:scale(1.08)}.wall button:hover{box-shadow:0 20px 50px -20px #000;transform:translateY(-4px)}
.wall em{position:absolute;left:12px;bottom:10px;font:700 11px 'Space Grotesk';font-style:normal;background:#000a;padding:5px 9px;border-radius:99px;backdrop-filter:blur(6px);display:flex;gap:6px;align-items:center;opacity:0;transform:translateY(8px);transition:.3s}.wall button:hover em{opacity:1;transform:none}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:48px}
.steps .card::after{counter-increment:s;content:"0" counter(s);position:absolute;right:22px;bottom:6px;font:900 70px 'Space Grotesk';color:#0b122010}
.cta{margin:0 clamp(16px,4vw,48px) 60px;border-radius:32px;padding:clamp(40px,7vw,90px);position:relative;overflow:hidden;background:linear-gradient(120deg,#5ccaf7,#27aae1 55%,#1d8fc4);color:#04121c}
.cta h2{max-width:700px}.cta p{margin:16px 0 28px;font-weight:600;max-width:520px}.cta .btn{background:#0a0a0a;color:#fff}.cta .btn.g{background:transparent;color:#0a0a0a;border-color:#0a0a0a55}
.cta::after{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:60px solid #ffffff2e;animation:rot 12s linear infinite;border-top-color:#fff8}
@keyframes rot{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--line);padding:48px clamp(16px,4vw,48px);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:32px;color:var(--mute);font-size:14px;line-height:1.7}
footer h4{color:var(--fg);font:700 12px 'Space Grotesk';margin-bottom:10px;letter-spacing:.1em}footer .ph{color:var(--acc)}
.rv{opacity:0;transform:translateY(34px);transition:1s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
@media(max-width:820px){nav ul{display:none}.hud{left:16px;right:auto;text-align:left;bottom:24px}.hud .row{justify-content:flex-start}.hc{left:16px;right:16px;max-width:none;bottom:150px}.scroll{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<p style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:#00b14f;color:white;padding:2rem;border-radius:1rem;font:700 1.2rem Sora;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3);">
🚀 Sedang loading logo client...<br>
<small style="font-size:0.85rem;opacity:0.9;margin-top:0.5rem;display:block;">File asli: index.html masih text-based</small><br>
<small style="font-size:0.85rem;opacity:0.9;">File ini (index-with-logos.html) akan menampilkan logo visual</small>
</p>
<script>
alert('File index-with-logos.html ini adalah DEMO menunjukkan bahwa untuk menampilkan LOGO VISUAL dari brand client, diperlukan:\n\n1. File gambar logo (PNG/SVG) untuk setiap brand\n2. Upload ke folder /public/logos/\n3. Load via JavaScript di canvas\n\nFile index.html yang sekarang menggunakan TEXT STYLING yang bagus sebagai "logo" karena:\n- Ini static HTML tanpa build process\n- Tidak ada image assets logo brand\n- Text dengan font Space Grotesk Bold + warna brand sudah cukup mewakili\n\nJika Anda punya file logo PNG/SVG dari 15 brand tersebut, saya bisa integrate ke canvas billboard.');
</script>
</body>
</html>
